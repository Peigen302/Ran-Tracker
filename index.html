<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数据排名追踪器</title>
<style>

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f4f0;color:#1a1a1a;min-height:100vh}
.header{background:#fff;border-bottom:1px solid #e8e6e0;padding:16px 24px;display:flex;align-items:center;justify-content:space-between}
.header h1{font-size:17px;font-weight:600;letter-spacing:-0.3px}
.header span{font-size:12px;color:#888;background:#f0efe9;padding:4px 10px;border-radius:20px}
.container{max-width:960px;margin:0 auto;padding:24px 16px}
.tabs{display:flex;gap:6px;margin-bottom:24px;background:#fff;padding:6px;border-radius:12px;border:1px solid #e8e6e0;width:fit-content}
.tab{padding:8px 20px;border-radius:8px;cursor:pointer;font-size:14px;color:#666;transition:all 0.15s;border:none;background:none}
.tab.active{background:#1a1a1a;color:#fff;font-weight:500}
.tab:hover:not(.active){background:#f0efe9;color:#1a1a1a}
.section{display:none}
.section.active{display:block}
.group-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.card{background:#fff;border:1px solid #e8e6e0;border-radius:14px;padding:18px}
.card-title{font-size:14px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between}
.chip{font-size:11px;color:#999;font-weight:400;background:#f5f4f0;padding:3px 8px;border-radius:10px}
label{font-size:12px;color:#888;display:block;margin-bottom:5px}
input[type=date],input[type=number]{width:100%;border:1px solid #ddd;border-radius:8px;padding:8px 10px;font-size:14px;background:#fff;color:#1a1a1a;margin-bottom:12px;outline:none;transition:border 0.15s}
input[type=date]:focus,input[type=number]:focus{border-color:#1a1a1a}
.btn{width:100%;padding:9px;background:#1a1a1a;color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;transition:all 0.15s}
.btn:hover{background:#333}
.btn:active{transform:scale(0.98)}
.result-box{margin-top:12px;padding:10px 14px;border-radius:10px;font-size:13px;font-weight:500;display:none}
.result-box.show{display:block}
.green{background:#eaf3de;color:#27500a}
.yellow{background:#faeeda;color:#633806}
.red-box{background:#fcebeb;color:#791f1f}
.pct-bar-wrap{height:5px;background:#f0efe9;border-radius:3px;margin-top:8px;overflow:hidden}
.pct-bar{height:5px;border-radius:3px;transition:width 0.4s}
.g5-card{border-color:#c8dff5;border-left:3px solid #378ADD}
.result-grid .card{cursor:default}
.stat-num{font-size:26px;font-weight:700;letter-spacing:-1px;margin:6px 0 2px}
.stat-label{font-size:11px;color:#999}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:9px 10px;border-bottom:1px solid #eee;color:#888;font-weight:500;font-size:12px}
td{padding:8px 10px;border-bottom:1px solid #f5f4f0;vertical-align:middle}
tr:last-child td{border-bottom:none}
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:500}
.del-btn{background:none;border:none;cursor:pointer;color:#ccc;font-size:14px;padding:3px 6px;border-radius:5px}
.del-btn:hover{color:#e24b4a;background:#fff0f0}
.clear-all{font-size:12px;color:#ccc;background:none;border:none;cursor:pointer;padding:4px 8px;border-radius:6px}
.clear-all:hover{color:#e24b4a;background:#fff0f0}
.section-intro{font-size:13px;color:#888;margin-bottom:20px;line-height:1.6}
.empty{color:#bbb;font-size:13px;padding:16px 0;text-align:center}
.load-btn{margin-top:12px;width:100%;padding:9px;background:#f5f4f0;color:#666;border:1px solid #ddd;border-radius:8px;font-size:12px;cursor:pointer}
.load-btn:hover{background:#eee}

</style>
</head>

<div class="header">
  <h1>📊 数据排名追踪器</h1>
  <span id="today-label"></span><span id="sync-badge" style="font-size:11px;margin-left:8px;padding:3px 8px;border-radius:10px;background:#faeeda;color:#633806">⏳ 连接中...</span><button onclick="refreshData()" style="font-size:11px;margin-left:6px;padding:3px 8px;border-radius:8px;border:1px solid #ddd;background:#f5f4f0;cursor:pointer">🔄 刷新</button>
</div>
<div class="container">
  <div class="tabs">
    <button class="tab active" onclick="switchTab('input')">输入数据</button>
    <button class="tab" onclick="switchTab('result')">查看结果</button>
    <button class="tab" onclick="switchTab('history')">历史记录</button>
  </div>

  <!-- 输入页 -->
  <div id="sec-input" class="section active">
    <p class="section-intro">每天为各组输入一条新数据。前4组保留最近 243 条，第5组保留最近 8 条，最旧的数据自动滚出。</p>
    <div style="margin-bottom:12px">
      <button class="load-btn" onclick="loadSampleData()">⚡ 点击加载示例数据（5组历史数据已准备好，可直接体验）</button>
    </div>
    <div class="group-grid">
      <div class="card" id="card1">
        <div class="card-title">第 1 组 <span class="chip" id="cnt1">0/243</span></div>
        <label>日期</label><input type="date" id="d1">
        <label>数值</label><input type="number" step="any" id="v1" placeholder="输入数值">
        <button class="btn" onclick="addData(1)">+ 添加</button>
        <div class="result-box" id="r1"></div>
      </div>
      <div class="card" id="card2">
        <div class="card-title">第 2 组 <span class="chip" id="cnt2">0/243</span></div>
        <label>日期</label><input type="date" id="d2">
        <label>数值</label><input type="number" step="any" id="v2" placeholder="输入数值">
        <button class="btn" onclick="addData(2)">+ 添加</button>
        <div class="result-box" id="r2"></div>
      </div>
      <div class="card" id="card3">
        <div class="card-title">第 3 组 <span class="chip" id="cnt3">0/243</span></div>
        <label>日期</label><input type="date" id="d3">
        <label>数值</label><input type="number" step="any" id="v3" placeholder="输入数值">
        <button class="btn" onclick="addData(3)">+ 添加</button>
        <div class="result-box" id="r3"></div>
      </div>
      <div class="card" id="card4">
        <div class="card-title">第 4 组 <span class="chip" id="cnt4">0/243</span></div>
        <label>日期</label><input type="date" id="d4">
        <label>数值</label><input type="number" step="any" id="v4" placeholder="输入数值">
        <button class="btn" onclick="addData(4)">+ 添加</button>
        <div class="result-box" id="r4"></div>
      </div>
      <div class="card g5-card" id="card5">
        <div class="card-title">第 5 组 <span class="chip" id="cnt5">0/8</span></div>
        <div style="font-size:11px;color:#888;margin-bottom:10px">计算8条均值，与 70 比较</div>
        <label>日期</label><input type="date" id="d5">
        <label>数值</label><input type="number" step="any" id="v5" placeholder="输入数值">
        <button class="btn" onclick="addData(5)">+ 添加</button>
        <div class="result-box" id="r5"></div>
      </div>
    </div>
  </div>

  <!-- 结果页 -->
  <div id="sec-result" class="section">
    <p class="section-intro">基于当前所有历史数据计算的最新排名结果。</p>
    <div class="group-grid result-grid" id="result-grid"></div>
  </div>

  <!-- 历史页 -->
  <div id="sec-history" class="section">
    <div id="history-content"></div>
  </div>
</div>

  if(!confirm('加载示例数据（会覆盖现有数据），确认吗？')) return;
  save(SAMPLE);
  updateCounts();
  document.querySelector('.load-btn').textContent='✅ 示例数据已加载！切换到「查看结果」标签查看';
  document.querySelector('.load-btn').style.background='#eaf3de';
  document.querySelector('.load-btn').style.color='#27500a';
}

function init(){
  document.getElementById('today-label').textContent=todayStr();
  for(let i=1;i<=5;i++) document.getElementById('d'+i).value=todayStr();
  loadFromCloud().then(() => {
    updateCounts();
  });
}

function updateCounts(){
  const d=load();
  for(let i=1;i<=5;i++) document.getElementById('cnt'+i).textContent=d['g'+i].length+'/'+CAPS[i-1];
}

function addData(g){
  const date=document.getElementById('d'+g).value;
  const val=parseFloat(document.getElementById('v'+g).value);
  if(!date||isNaN(val)){showRes(g,'<span style="color:#e24b4a">请填写日期和数值</span>','');return;}
  const d=load();
  const arr=d['g'+g];
  arr.push({date,val});
  arr.sort((a,b)=>a.date.localeCompare(b.date));
  if(!d['ev'+g]) d['ev'+g]=[];
  while(arr.length>CAPS[g-1]){
    const evicted=arr.shift();
    evicted.evictedAt=new Date().toISOString().slice(0,10);
    d['ev'+g].unshift(evicted);
    if(d['ev'+g].length>100) d['ev'+g].pop();
  }
  d['g'+g]=arr;
  save(d);
  document.getElementById('v'+g).value='';
  updateCounts();
  const res=calcResult(g,arr,val);
  showRes(g,res.text,res.cls);
}

function calcResult(g,arr,val){
  if(g<=4){
    const sorted=[...arr.map(x=>x.val)].sort((a,b)=>a-b);
    const rank=sorted.filter(v=>v<val).length+1;
    const total=arr.length;
    const pct=total>1?Math.round((rank-1)/(total-1)*100):0;
    let cls,icon,label;
    if(pct<=30){cls='green';icon='🟢';label='低位 0–30%'}
    else if(pct<=60){cls='yellow';icon='🟡';label='中位 30–60%'}
    else{cls='red-box';icon='🔴';label='高位 60%+'}
    return {cls,text:`<div style="display:flex;align-items:baseline;gap:6px;flex-wrap:wrap">
      <span style="font-size:15px;font-weight:700">${icon} 第${rank}名</span>
      <span style="font-size:12px;font-weight:400;opacity:0.7">共${total}条</span>
      <span style="font-size:13px;font-weight:600">排名 ${pct}%</span>
      <span style="font-size:12px;font-weight:400">${label}</span>
    </div>
    <div class="pct-bar-wrap"><div class="pct-bar" style="width:${pct}%;background:${pct<=30?'#639922':pct<=60?'#BA7517':'#E24B4A'}"></div></div>`};
  } else {
    const avg=Math.round(arr.reduce((s,x)=>s+x.val,0)/arr.length*100)/100;
    if(avg>=70) return{cls:'green',text:`✅ 均值 <b>${avg}</b> ≥ 70`};
    else return{cls:'red-box',text:`⚠️ 均值 <b>${avg}</b> < 70`};
  }
}

function showRes(g,text,cls){
  const el=document.getElementById('r'+g);
  el.className='result-box show '+(cls||'');
  el.innerHTML=text;
}

function switchTab(t){
  document.querySelectorAll('.tab').forEach((el,i)=>el.classList.toggle('active',['input','result','history'][i]===t));
  document.querySelectorAll('.section').forEach(el=>el.classList.remove('active'));
  document.getElementById('sec-'+t).classList.add('active');
  if(t==='result') renderResults();
  if(t==='history') renderHistory();
}

function renderResults(){
  const d=load();
  let html='';
  for(let g=1;g<=5;g++){
    const arr=d['g'+g];
    if(!arr.length){html+=`<div class="card"><div class="card-title">第 ${g} 组</div><div class="empty">暂无数据</div></div>`;continue;}
    const latest=arr[arr.length-1];
    if(g<=4){
      const sorted=[...arr.map(x=>x.val)].sort((a,b)=>a-b);
      const rankPos=sorted.filter(v=>v<latest.val).length+1;
      const pct=arr.length>1?Math.round((rankPos-1)/(arr.length-1)*100):0;
      const col=pct<=30?'#639922':pct<=60?'#BA7517':'#E24B4A';
      const bg=pct<=30?'#eaf3de':pct<=60?'#faeeda':'#fcebeb';
      html+=`<div class="card"><div class="card-title">第 ${g} 组 <span class="chip">${arr.length}/${CAPS[g-1]}</span></div>
      <div style="font-size:12px;color:#999;margin-bottom:4px">最新: ${latest.date} · ${latest.val}</div>
      <div class="stat-num" style="color:${col}">${pct}%</div>
      <div style="font-size:13px;color:#666;margin:2px 0 6px">第 <b>${rankPos}</b> 名 / 共 ${arr.length} 条</div>
      <div class="pct-bar-wrap" style="margin-top:4px"><div class="pct-bar" style="width:${pct}%;background:${col}"></div></div>
      <span class="badge" style="background:${bg};color:${col};margin-top:8px">${pct<=30?'低位 0–30%':pct<=60?'中位 30–60%':'高位 60%+'}</span></div>`;
    } else {
      const avg=Math.round(arr.reduce((s,x)=>s+x.val,0)/arr.length*100)/100;
      const ok=avg>=70;
      html+=`<div class="card g5-card"><div class="card-title">第 5 组 <span class="chip">${arr.length}/${CAPS[4]}</span></div>
      <div style="font-size:12px;color:#999;margin-bottom:4px">最新: ${latest.date} · ${latest.val}</div>
      <div class="stat-num" style="color:${ok?'#27500a':'#791f1f'}">${avg}</div>
      <div class="stat-label">8条均值</div>
      <span class="badge" style="background:${ok?'#eaf3de':'#fcebeb'};color:${ok?'#27500a':'#791f1f'};margin-top:8px">${ok?'✅ 均值 ≥ 70':'⚠️ 均值 < 70'}</span></div>`;
    }
  }
  document.getElementById('result-grid').innerHTML=html;
}

function renderHistory(){
  const d=load();
  let html='';
  for(let g=1;g<=5;g++){
    const arr=[...d['g'+g]].reverse();
    const evArr=d['ev'+g]||[];
    html+=`<div class="card" style="margin-bottom:14px"><div class="card-title">第 ${g} 组历史 <span class="chip">${arr.length}/${CAPS[g-1]}</span>
    <button class="clear-all" onclick="clearGroup(${g})">清空</button></div>`;
    if(!arr.length){html+=`<div class="empty">暂无数据</div>`;}
    else {
      html+=`<table><thead><tr><th>日期</th><th>数值</th>${g<=4?'<th>排名%</th>':''}<th></th></tr></thead><tbody>`;
      const origArr=d['g'+g];
      arr.forEach(item=>{
        if(g<=4){
          const sorted=[...origArr.map(x=>x.val)].sort((a,b)=>a-b);
          const pct=origArr.length>1?Math.round((sorted.filter(v=>v<item.val).length)/(origArr.length-1)*100):0;
          const bg=pct<=30?'#eaf3de':pct<=60?'#faeeda':'#fcebeb';
          const col=pct<=30?'#27500a':pct<=60?'#633806':'#791f1f';
          const rankPos2=sorted.filter(v=>v<item.val).length+1;
          html+=`<tr><td>${item.date}</td><td>${item.val}</td><td><span class="badge" style="background:${bg};color:${col}">第${rankPos2}名 · ${pct}%</span></td><td><button class="del-btn" onclick="delItem(${g},'${item.date}')">✕</button></td></tr>`;
        } else {
          html+=`<tr><td>${item.date}</td><td>${item.val}</td><td><button class="del-btn" onclick="delItem(${g},'${item.date}')">✕</button></td></tr>`;
        }
      });
      html+=`</tbody></table>`;
    }
    if(evArr.length){
      html+=`<div style="margin-top:14px;padding-top:12px;border-top:1px dashed #eee">
      <div style="font-size:12px;font-weight:600;color:#999;margin-bottom:8px;display:flex;align-items:center;gap:6px">
        <span style="background:#f5f4f0;padding:2px 8px;border-radius:10px">📤 已滚出记录 (${evArr.length}条)</span>
        <button class="clear-all" onclick="clearEvicted(${g})" style="font-size:11px">清空</button>
      </div>
      <table><thead><tr><th>原始日期</th><th>数值</th><th>滚出时间</th></tr></thead><tbody>`;
      evArr.forEach(item=>{
        html+=`<tr style="opacity:0.6"><td>${item.date}</td><td>${item.val}</td><td style="color:#aaa;font-size:12px">${item.evictedAt||'—'}</td></tr>`;
      });
      html+=`</tbody></table></div>`;
    } else if(arr.length>=CAPS[g-1]){
      html+=`<div style="margin-top:10px;font-size:12px;color:#bbb;padding-top:10px;border-top:1px dashed #eee">📤 暂无滚出记录（从今天起新增数据超过上限时会在这里显示）</div>`;
    }
    html+=`</div>`;
  }
  document.getElementById('history-content').innerHTML=html;
}

function delItem(g,date){
  const d=load();d['g'+g]=d['g'+g].filter(x=>x.date!==date);save(d);updateCounts();renderHistory();
}
function clearGroup(g){
  if(!confirm('确认清空第'+g+'组所有数据？'))return;
  const d=load();d['g'+g]=[];save(d);updateCounts();renderHistory();
}
function clearEvicted(g){
  if(!confirm('确认清空第'+g+'组的滚出记录？'))return;
  const d=load();d['ev'+g]=[];save(d);renderHistory();
}

function refreshData(){
  _mem=null;
  loadFromCloud().then(()=>{
    updateCounts();
    const active=document.querySelector('.section.active');
    if(active&&active.id==='sec-result') renderResults();
    if(active&&active.id==='sec-history') renderHistory();
  });
}

init();
</script>
</html>
